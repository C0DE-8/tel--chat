<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Chat Widget</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172026;
            background: #f6f8fb;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 72px 24px;
        }

        h1 {
            max-width: 660px;
            margin: 0 0 16px;
            font-size: clamp(34px, 5vw, 56px);
            line-height: 1.04;
            letter-spacing: 0;
        }

        p {
            max-width: 620px;
            margin: 0;
            color: #526170;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <main>
        <h1>Telegram-powered live chat</h1>
        <p>Open the chat button, enter a name and email, and messages will route through the reusable backend to the site owner registered from the Telegram bot.</p>
    </main>
    <script src="/frontend-widget.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const ownerKey = params.get("owner");

        if (ownerKey) {
            window.TelegramChatWidget.mount({ ownerKey, baseUrl: window.location.origin });
        } else {
            fetch("/api/config")
                .then((response) => response.json())
                .then((config) => {
                    if (config.ownerKey) {
                        window.TelegramChatWidget.mount({
                            ownerKey: config.ownerKey,
                            baseUrl: window.location.origin
                        });
                    }
                });
        }
    </script>
</body>
</html>
